name: Keep Render Bot Alive 24/7

on:
  schedule:
    # Runs every 10 minutes every day 24/7
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Send Keep-Alive Ping to Render Cloud
        run: |
          echo "Sending ping to Render application (https://quantum-ai-bot.onrender.com/health)..."
          curl -s -o /dev/null -w "%{http_code}" https://quantum-ai-bot.onrender.com/health || true
